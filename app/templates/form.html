{% extends "base.html" %}
{% block titulo %}Flasky{% endblock %}

{% block conteudo %}

<div class="page-header">
    <h1>Hello, {% if name %}{{ name }}{% else %}Stranger{% endif %}!</h1>
</div>

<form method="POST">
    {{ form.hidden_tag() }}

    {{ form.name.label }}
    {{ form.name(class="form-control") }}

    <div style="margin-top: 10px;">
        {{ form.submit(class="btn btn-default") }}
    </div>
</form>

{% endblock %}
